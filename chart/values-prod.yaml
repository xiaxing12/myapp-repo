replicaCount: 3                              # prod 副本数，比 dev 多，保证可用性

image:
  repository: ghcr.io/xiaxing12/myapp        # 与 dev 用同一个镜像，靠 values 文件区分环境
  tag: "latest"                              # 生产建议改用 commit SHA，见手册「已知弱点」
  pullPolicy: IfNotPresent                   # 本地有就不重新下载

service:
  type: ClusterIP
  port: 80                                   # Service 端口
  targetPort: 80                             # 转发到容器 80（标准 nginx 监听 80）

resources:                                   # 生产资源配额比 dev 给得多
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:                                      # 探针参数，与 dev 保持一致
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

ingress:
  enabled: false                             # 集群里还没装 ingress controller，先关；装好后改成 true 即可
  className: nginx
  host: myapp.local
  path: /

hpa:                                         # 生产开自动扩缩容
  enabled: true                              # 注意：HPA 依赖 metrics-server，未安装时 TARGETS 会显示 <unknown>
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50
